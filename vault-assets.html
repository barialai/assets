<script>
'use strict';
/* Vault is a self-contained, local-first personal ledger. No network requests. */
(() => {
const STORAGE_KEY = 'vault.personal.assets.v1';
const VERSION = 1;
const CATEGORY = {
  cash:{label:'Cash & savings',short:'Cash',icon:'wallet',color:'#989891'},
  forex:{label:'Forex account',short:'Forex',icon:'chart',color:'#FCFF1A'},
  crypto:{label:'Crypto holding',short:'Crypto',icon:'coin',color:'#E4E4DF'},
  stocks:{label:'Stocks / ETFs',short:'Stocks',icon:'chart',color:'#C3C3BC'},
  property:{label:'Property / physical asset',short:'Property',icon:'grid',color:'#B0B0A5'},
  other:{label:'Other investment',short:'Other',icon:'folder',color:'#56564F'},
  prop:{label:'Prop / demo account',short:'Prop / demo',icon:'shield',color:'#77776B'}
};
const KIND = {
  profit:{label:'Profit',icon:'arrow-up',sign:1}, loss:{label:'Loss',icon:'arrow-down',sign:-1},
  deposit:{label:'Deposit',icon:'download',sign:1}, withdrawal:{label:'Withdrawal',icon:'upload',sign:-1},
  transfer_in:{label:'Transfer in',icon:'transfer',sign:1},transfer_out:{label:'Transfer out',icon:'transfer',sign:-1},
  valuation:{label:'Value update',icon:'edit',sign:1},basis:{label:'Capital update',icon:'edit',sign:1}
};
const $ = (selector,root=document) => root.querySelector(selector);
const $$ = (selector,root=document) => Array.from(root.querySelectorAll(selector));
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const uid = () => window.crypto && crypto.randomUUID ? crypto.randomUUID() : 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,12);
const localDate = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dateObj = str => new Date(str+'T12:00:00');
const shiftDate = (n,base=new Date()) => {const d=new Date(base);d.setDate(d.getDate()+n);return localDate(d);};
const round = n => Math.round((n+Number.EPSILON)*1e8)/1e8;
const dateLabel = (date,options={month:'short',day:'numeric'}) => dateObj(date).toLocaleDateString('en-US',options);
const today = () => localDate();
let storageOk = true, corruptRaw = '', persistenceBlocked = false, modalDraft = null, pendingExternal = null;
let ui = {page:['overview','tracker','activity','settings'].includes(location.hash.slice(1))?location.hash.slice(1):'overview',assetFilter:'all',assetQuery:'',period:'30D',openMenu:null,trackerAccount:'',trackerDate:'',month:new Date(new Date().getFullYear(),new Date().getMonth(),1),activityAccount:'',activityKind:'all',activityQuery:'',activityPage:1,chartPoints:[]};
function blankState() {return {version:VERSION,demo:false,profile:{name:'Nawab',subtitle:'Personal portfolio',photo:'',badge:true},settings:{displayCurrency:'USDT',hideBalances:false,rates:{USDT:1,USD:1},lastBackup:null},assets:[],entries:[],snapshots:[{date:today(),value:0}],updatedAt:new Date().toISOString()};}
function sampleState() {
  const s=blankState();s.demo=true;
  const rows=[
    ['demo_cash','Cash wallet','cash','Available to invest',5000,5000,'',null,null],
    ['demo_ic','IC Markets','forex','Trading account',5500,6420,'IC',null,null],
    ['demo_ex','Exness','forex','Trading account',2500,2365,'EX',null,null],
    ['demo_btc','Bitcoin','crypto','Binance',7500,8750,'BTC',.125,70000],
    ['demo_eth','Ethereum','crypto','Binance',4500,4875,'ETH',1.5,3250],
    ['demo_savings','Savings vault','other','Long-term savings',3000,3030,'SV',null,null]
  ];
  s.assets=rows.map(r=>({id:r[0],name:r[1],category:r[2],platform:r[3],currency:'USDT',openingCapital:r[4],openingValue:r[5],symbol:r[6],units:r[7],unitPrice:r[8],logo:'',notes:'Illustrative sample data. Replace with your own values.',included:true,createdAt:new Date().toISOString(),startDate:shiftDate(-60)}));
  const logs=[[-11,'demo_ic','profit',140,'London session'],[-10,'demo_ex','profit',75,'Gold scalp'],[-9,'demo_ic','loss',95,'Risk limit respected'],[-7,'demo_ex','profit',160,'XAUUSD trade'],[-6,'demo_ic','profit',225,'Trend continuation'],[-5,'demo_ex','loss',110,'Stopped out'],[-4,'demo_ic','profit',200,'New York session'],[-3,'demo_ic','loss',80,'Closed early'],[-2,'demo_ex','profit',100,'Gold intraday'],[-1,'demo_ic','profit',120,'Session closed'],[0,'demo_ic','profit',180,'Gold - London session'],[0,'demo_ex','loss',235,'Daily trading result']];
  s.entries=logs.map((r,i)=>({id:'demo_entry_'+i,assetId:r[1],kind:r[2],amount:r[3],note:r[4],date:shiftDate(r[0]),createdAt:new Date(Date.now()-(12-i)*60000).toISOString(),fx:1,groupId:''}));
  for(const a of s.assets) a.openingValue=round(a.openingValue-s.entries.filter(e=>e.assetId===a.id).reduce((t,e)=>t+effect(e).value,0));
  const curve=[27320,27620,27550,27900,27690,27640,27880,27810,28280,28110,28260,28710,28660,28560,28860,28950,28820,28790,29300,29220,29590,29460,29490,29790,30000,29940,29780,30170,30220,30440];
  s.snapshots=curve.map((v,i)=>({date:shiftDate(i-29),value:v}));
  return s;
}
function effect(e) {
  if(e.kind==='basis') return {value:0,capital:e.amount};
  if(e.kind==='valuation') return {value:e.amount,capital:0};
  const value=KIND[e.kind].sign*e.amount;
  return {value,capital:['deposit','withdrawal','transfer_in','transfer_out'].includes(e.kind)?value:0};
}
function validDate(d){if(typeof d!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(d))return false;const x=dateObj(d);return Number.isFinite(x.getTime())&&localDate(x)===d;}
function validNumber(x,min=-1e13,max=1e13){return typeof x==='number'&&Number.isFinite(x)&&x>=min&&x<=max;}
function safeImage(x){return typeof x==='string'&&x.length<750000&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(x)?x:'';}
function validateState(input) {
  if(!input||input.version!==1||!Array.isArray(input.assets)||!Array.isArray(input.entries)||!Array.isArray(input.snapshots)||!input.settings||!input.profile) throw Error('This is not a supported Vault backup (version 1).');
  if(input.assets.length>500||input.entries.length>20000||input.snapshots.length>10000) throw Error('This backup is too large for this local dashboard.');
  const out=blankState(), rates=input.settings.rates;
  if(!rates||typeof rates!=='object'||Array.isArray(rates))throw Error('The backup has no valid currency rates.');
  out.settings.rates={USDT:1};
  for(const [c,r] of Object.entries(rates)){if(!/^[A-Z][A-Z0-9]{1,9}$/.test(c)||!validNumber(r,1e-12,1e12)) throw Error('Invalid currency conversion in backup.');if(c!=='USDT')out.settings.rates[c]=r;}
  out.settings.displayCurrency=Object.hasOwn(out.settings.rates,input.settings.displayCurrency)?input.settings.displayCurrency:'USDT';
  out.settings.hideBalances=Boolean(input.settings.hideBalances);
  out.settings.lastBackup=typeof input.settings.lastBackup==='string'?input.settings.lastBackup.slice(0,40):null;
  out.profile={name:String(input.profile.name||'My portfolio').slice(0,40),subtitle:String(input.profile.subtitle||'Personal portfolio').slice(0,80),photo:safeImage(input.profile.photo),badge:Boolean(input.profile.badge)};
  out.demo=Boolean(input.demo);out.updatedAt=typeof input.updatedAt==='string'?input.updatedAt:new Date().toISOString();
  const ids=new Set(), entryIds=new Set();
  for(const a of input.assets){
    if(!a||typeof a.id!=='string'||!/^[-_A-Za-z0-9]{1,80}$/.test(a.id)||ids.has(a.id)||!Object.hasOwn(CATEGORY,a.category)||!Object.hasOwn(out.settings.rates,a.currency)||!validNumber(a.openingCapital,0)||!validNumber(a.openingValue,0))throw Error('An asset has invalid or duplicate data.');
    ids.add(a.id);out.assets.push({id:a.id,name:String(a.name||'Unnamed asset').slice(0,60),category:a.category,platform:String(a.platform||'').slice(0,60),currency:a.currency,openingCapital:a.openingCapital,openingValue:a.openingValue,logo:safeImage(a.logo),symbol:String(a.symbol||'').slice(0,15),units:validNumber(a.units,0)?a.units:null,unitPrice:validNumber(a.unitPrice,0)?a.unitPrice:null,notes:String(a.notes||'').slice(0,600),included:a.included!==false,createdAt:String(a.createdAt||new Date().toISOString()).slice(0,40),startDate:validDate(a.startDate)?a.startDate:today()});
  }
  for(const e of input.entries){
    if(!e||typeof e.id!=='string'||!/^[-_A-Za-z0-9]{1,80}$/.test(e.id)||entryIds.has(e.id)||!ids.has(e.assetId)||!Object.hasOwn(KIND,e.kind)||!validDate(e.date)||!validNumber(e.amount,['valuation','basis'].includes(e.kind)?-1e13:0)||!validNumber(e.fx,1e-12,1e12)) throw Error('A ledger entry is invalid or refers to a missing asset.');
    entryIds.add(e.id);out.entries.push({id:e.id,assetId:e.assetId,kind:e.kind,amount:e.amount,note:String(e.note||'').slice(0,300),date:e.date,createdAt:String(e.createdAt||e.date+'T12:00:00Z').slice(0,40),fx:e.fx,groupId:e.kind.startsWith('transfer_')&&typeof e.groupId==='string'?e.groupId.slice(0,80):''});
  }
  const groups=new Map();
  for(const e of out.entries)if(e.kind.startsWith('transfer_')){if(!e.groupId)throw Error('A transfer is missing its linked entry.');if(!groups.has(e.groupId))groups.set(e.groupId,[]);groups.get(e.groupId).push(e);}
  for(const g of groups.values())if(g.length!==2||new Set(g.map(e=>e.kind)).size!==2||g[0].assetId===g[1].assetId)throw Error('An internal transfer is incomplete.');
  const snapMap=new Map();for(const p of input.snapshots){if(!p||!validDate(p.date)||!validNumber(p.value))throw Error('Invalid value-history data.');snapMap.set(p.date,{date:p.date,value:p.value});}out.snapshots=[...snapMap.values()].sort((a,b)=>a.date.localeCompare(b.date));
  return out;
}
let state;
try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){try{state=validateState(JSON.parse(raw));}catch(err){corruptRaw=raw;persistenceBlocked=true;storageOk=false;state=blankState();}}else{state=sampleState();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}}
catch(err){state=state||sampleState();storageOk=false;}
function rate(c){return state.settings.rates[c]||1;}
function assetById(id){return state.assets.find(a=>a.id===id);}
function entriesFor(id){return state.entries.filter(e=>e.assetId===id);}
function metrics(a) {
  let value=a.openingValue,net=a.openingCapital,gross=a.openingCapital,opening=a.openingCapital,external=a.openingCapital;
  for(const e of state.entries){if(e.assetId!==a.id)continue;const d=effect(e);value+=d.value;net+=d.capital;if(['deposit','transfer_in','basis'].includes(e.kind))gross+=d.capital;if(['deposit','basis'].includes(e.kind))external+=d.capital;if(e.kind==='basis')opening+=e.amount;}
  const pnl=round(value-net);
  return {value:round(value),net:round(net),gross:round(gross),opening:round(opening),external:round(external),pnl,roi:gross>0.00000001?pnl/gross*100:null,usdt:value*rate(a.currency)};
}
function totals(){let value=0,net=0,gross=0,external=0;const included=state.assets.filter(a=>a.included);for(const a of included){const m=metrics(a),r=rate(a.currency);value+=m.value*r;net+=m.net*r;gross+=m.gross*r;external+=m.external*r;}return {value:round(value),net:round(net),gross:round(gross),external:round(external),pnl:round(value-net),roi:external>0?(value-net)/external*100:null,count:included.length};}
function currencySymbol(c){return ({USDT:'$',USD:'$',EUR:'\u20ac',GBP:'\u00a3',INR:'\u20b9',JPY:'\u00a5'})[c]||c+' ';}
function numeric(n,digits=2){return new Intl.NumberFormat('en-US',{minimumFractionDigits:digits,maximumFractionDigits:digits}).format(n);}

function trackerPage(){const monthPrefix=`${ui.month.getFullYear()}-${String(ui.month.getMonth()+1).padStart(2,'0')}`,entries=pnlEntries(ui.trackerAccount),thisMonth=entries.filter(e=>e.date.startsWith(monthPrefix)),todayNet=entries.filter(e=>e.date===today()).reduce((s,e)=>s+pnlValue(e),0),monthNet=thisMonth.reduce((s,e)=>s+pnlValue(e),0);let dayMap=new Map();for(const e of thisMonth)dayMap.set(e.date,(dayMap.get(e.date)||0)+pnlValue(e));const wins=[...dayMap.values()].filter(v=>v>0).length,losses=[...dayMap.values()].filter(v=>v<0).length,best=dayMap.size?Math.max(...dayMap.values()):0;const filtered=entries.filter(e=>!ui.trackerDate||e.date===ui.trackerDate).sort(sortEntries);
return `${demoBanner()}<div class="page-heading"><div><h1>Daily profit tracker</h1><p>Small entries. A clearer picture of your progress.</p></div><button class="btn btn-primary" data-action="entry" ${ui.trackerAccount?`data-id="${ui.trackerAccount}"`:''}>${icon('plus')}Add entry</button></div><div class="filter-row"><select class="input" id="tracker-account" aria-label="Filter daily tracker by account">${accountOptions(ui.trackerAccount)}</select><span class="field-help">${ui.trackerAccount&&!assetById(ui.trackerAccount)?.included?'This account is tracked but excluded from net worth.':'Profit / loss only. Deposits and transfers are excluded.'}</span></div><div class="stat-grid"><div class="stat-card"><span>Today's net P&amp;L</span><strong class="${tone(todayNet)}">${money(todayNet,{signed:true})}</strong><small>${dateLabel(today(),{month:'long',day:'numeric'})}</small></div><div class="stat-card"><span>Selected month</span><strong class="${tone(monthNet)}">${money(monthNet,{signed:true})}</strong><small>${ui.month.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</small></div><div class="stat-card"><span>Profitable days</span><strong>${wins}<span style="font-size:13px;color:#797979"> / ${dayMap.size}</span></strong><small>${losses} losing ${losses===1?'day':'days'} in this month</small></div><div class="stat-card"><span>Best day this month</span><strong class="${tone(best)}">${money(best,{signed:true})}</strong><small>${dayMap.size?'Based on your logged entries':'No results recorded yet'}</small></div></div><div class="tracker-grid"><section class="panel"><div class="panel-heading"><div><h3>P&amp;L calendar</h3><p>Click a day to see its entries</p></div><div class="calendar-controls"><button class="icon-button previous" data-action="month" data-delta="-1" aria-label="Previous month">${icon('chevron')}</button><span class="calendar-title">${ui.month.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</span><button class="icon-button" data-action="month" data-delta="1" aria-label="Next month">${icon('chevron')}</button></div></div>${calendarMarkup(dayMap)}<div class="calendar-key"><span><i></i>Profit</span><span><i class="loss"></i>Loss</span><span>Recorded days only</span></div></section><section class="panel monthly-insight"><div class="insight-label">Your monthly result</div><div class="insight-total ${tone(monthNet)}">${money(monthNet,{signed:true})}</div><div class="insight-sub">${thisMonth.length} ${thisMonth.length===1?'entry':'entries'} across ${dayMap.size} ${dayMap.size===1?'day':'days'}.<br>Keep the record. See the bigger picture.</div><div class="insight-rows"><div class="insight-row"><span>Gross profit</span><strong class="positive">${money(thisMonth.filter(e=>e.kind==='profit').reduce((s,e)=>s+pnlValue(e),0),{signed:true})}</strong></div><div class="insight-row"><span>Gross loss</span><strong class="negative">${money(thisMonth.filter(e=>e.kind==='loss').reduce((s,e)=>s+pnlValue(e),0),{signed:true})}</strong></div><div class="insight-row"><span>Profitable-day rate</span><strong>${dayMap.size?pct(wins/dayMap.size*100,{signed:false}):'\u2014'}</strong></div><div class="insight-row"><span>Average recorded day</span><strong>${money(dayMap.size?monthNet/dayMap.size:0,{signed:true})}</strong></div></div></section></div><section class="panel daily-panel"><div class="panel-heading"><div><h3>${ui.trackerDate?'Entries for '+dateLabel(ui.trackerDate):'Your P&L entries'}</h3><p>${ui.trackerDate?'One day at a time.':'Most recent first. All recorded dates.'}</p></div><div class="section-actions">${ui.trackerDate?'<button class="btn btn-secondary btn-small" data-action="clear-day">Clear date filter</button>':''}<button class="btn btn-secondary btn-small" data-action="export-csv">${icon('download')}Export CSV</button></div></div>${ledgerTable(filtered.slice(0,100))}${filtered.length>100?'<div class="table-footer"><span>Showing the latest 100. Use a day filter or export the full ledger.</span></div>':''}</section>`;

function calendarMarkup(dayMap){const y=ui.month.getFullYear(),m=ui.month.getMonth(),offset=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();let cells=Array.from({length:offset},()=>'<span class="calendar-day empty"></span>').join('');for(let d=1;d<=days;d++){const date=localDate(new Date(y,m,d)),v=dayMap.get(date);cells+=`<button class="calendar-day ${date===today()?'today':''} ${date===ui.trackerDate?'selected':''} ${v>0?'profit':v<0?'loss':''}" data-action="calendar-day" data-date="${date}" aria-label="${dateLabel(date,{month:'long',day:'numeric',year:'numeric'})}${v!==undefined?', '+money(v,{signed:true}):', no entries'}"><span>${d}</span>${v!==undefined?`<strong class="${tone(v)}">${shortMoney(v)}</strong>`:''}</button>`;}return `<div class="calendar-grid">${['MON','TUE','WED','THU','FRI','SAT','SUN'].map(d=>`<span class="calendar-weekday">${d}</span>`).join('')}${cells}</div>`;}
function activityFiltered(){return state.entries.filter(e=>(!ui.activityAccount||e.assetId===ui.activityAccount)&&(ui.activityKind==='all'||(ui.activityKind==='pnl'?['profit','loss'].includes(e.kind):ui.activityKind==='capital'?['deposit','withdrawal','transfer_in','transfer_out'].includes(e.kind):['valuation','basis'].includes(e.kind)))&&(!ui.activityQuery||(e.note+' '+assetById(e.assetId)?.name+' '+KIND[e.kind].label).toLowerCase().includes(ui.activityQuery.toLowerCase()))).sort(sortEntries);}
function activityContents(){const rows=activityFiltered(),per=15,pages=Math.max(1,Math.ceil(rows.length/per));ui.activityPage=Math.min(pages,ui.activityPage);return ledgerTable(rows.slice((ui.activityPage-1)*per,ui.activityPage*per),{emptyMessage:'Your profits, losses, transfers, deposits and value updates will appear here.'})+`<div class="table-footer"><span>${rows.length} ledger ${rows.length===1?'entry':'entries'}</span><div class="pagination"><button class="btn btn-ghost btn-small" data-action="activity-page" data-delta="-1" ${ui.activityPage===1?'disabled':''}>Previous</button><span>${ui.activityPage} / ${pages}</span><button class="btn btn-ghost btn-small" data-action="activity-page" data-delta="1" ${ui.activityPage===pages?'disabled':''}>Next</button></div></div>`;}

unt credentials or private keys.</span></div>${corruptRaw?`<div class="setting-action"><div><strong class="negative">Saved data needs recovery</strong><p>Your original saved data has not been overwritten.</p></div><button class="btn btn-secondary btn-small" data-action="recovery">Export recovery copy</button></div>`:''}<div class="setting-action"><div><strong>Export a full backup</strong><p>Includes assets, entries, profile, logos, settings and value history.</p></div><button class="btn btn-secondary btn-small" data-action="export">${icon('download')}Export JSON</button></div><div class="setting-action"><div><strong>Restore from backup</strong><p>Replaces this workspace. Export your current records first.</p></div><button class="btn btn-secondary btn-small" data-action="import">${icon('upload')}Import JSON</button></div><div class="setting-action"><div><strong>Export your activity</strong><p>A CSV of your complete ledger for your own records.</p></div><button class="btn btn-secondary btn-small" data-action="export-csv">${icon('download')}Export CSV</button></div><p class="field-help" style="margin:12px 0 0">Last backup: ${state.settings.lastBackup?new Date(state.settings.lastBackup).toLocaleString():'No backup exported yet'}</p></section></div><div class="settings-stack"><section class="panel settings-panel"><h3>Currency conversions</h3><p>Set how much <strong>1 unit</strong> of a currency is worth in USDT. These rates are manual, not live.</p><form id="rates-form"><div class="rate-row"><div><strong>USDT</strong><small>Base currency</small></div><input class="input" value="1" disabled aria-label="USDT base exchange rate"><span></span></div>${Object.entries(state.settings.rates).filter(([c])=>c!=='USDT').map(([c,r])=>`<div class="rate-row"><div><strong>${esc(c)}</strong><small>1 ${esc(c)} = ${esc(r)} USDT</small></div><input class="input" type="number" min="0.000000000001" max="1000000000000" step="any" required value="${r}" data-rate="${esc(c)}" aria-label="USDT val function readAssetForm(){const f=$('#asset-form');if(!f)return null;const data=new FormData(f),old=modalDraft.id?assetById(modalDraft.id):null;return {name:String(data.get('name')||'').trim(),category:String(data.get('category')),platform:String(data.get('platform')||'').trim(),currency:old&&entriesFor(old.id).length?old.currency:String(data.get('currency')),opening:Number(data.get('investment')),current:Number(data.get('current')),symbol:String(data.get('symbol')||'').trim().toUpperCase(),units:data.get('units')===''?null:Number(data.get('units')),unitPrice:data.get('unitPrice')===''?null:Number(data.get('unitPrice')),notes:String(data.get('notes')||'').trim(),included:$('#asset-included').checked,customCode:String(data.get('customCode')||'').trim().toUpperCase(),customRate:Number(data.get('customRate'))};}
function saveAsset(){if(modalDraft?.type!=='asset')return;const d=readAssetForm();if(!d||!d.name)return formError('Give this asset a name.');if(!Object.hasOwn(CATEGORY,d.category))return formError('Select a valid asset type.');if(!validNumber(d.opening,0)||!validNumber(d.current,0))return formError('Investment and current value must be valid, non-negative amounts.');if((d.units!==null&&!validNumber(d.units,0))||(d.unitPrice!==null&&!validNumber(d.unitPrice,0)))return formError('Quantity and unit price must be non-negative numbers.');
  let newRate=null;if(d.currency==='__custom__'){if(!/^[A-Z][A-Z0-9]{1,9}$/.test(d.customCode))return formError('Enter a currency code such as EUR or AED.');if(!validNumber(d.customRate,1e-12,1e12))return formError('Enter a positive USDT conversion rate.');if(d.customCode==='USDT'&&d.customRate!==1)return formError('USDT is the base currency and its rate must stay 1.');if(Object.hasOwn(state.settings.rates,d.customCode)&&Math.abs(state.settings.rates[d.customCode]-d.customRate)>1e-12)return formError('This currency already exists with a different rate. Choose it in the menu, or change its rate in Settings.');d.currency=d.customCode;newRate=d.customRate;}else if(!Object.hasOwn(state.settings.rates,d.currency))return formError('Select a valid currency.');

  if(a){const m=metrics(a),hasEntries=entriesFor(a.id).length;if(a.currency!==d.currency&&!hasEntries){Object.assign(a,fields,{openingCapital:d.opening,openingValue:d.current});}else{Object.assign(a,fields);const valueDelta=round(d.current-m.value),basisDelta=round(d.opening-m.opening);if(Math.abs(valueDelta)>.00000001)appendEntry(a,'valuation',valueDelta,today(),'Manual current-value update');if(Math.abs(basisDelta)>.00000001)appendEntry(a,'basis',basisDelta,today(),'Opening investment corrected');}}

function renderEntryForm(){const d=modalDraft,a=assetById(d.assetId)||state.assets[0];d.assetId=a.id;const c=a.currency,transfer=d.kind==='transfer';

function updateEntryPreview(){if(modalDraft?.type!=='entry'||!$('#entry-form'))return;entryDraftFromForm();const d=modalDraft,a=assetById(d.assetId),m=metrics(a),amount=Number(d.amount)||0,negative=['loss','withdrawal','transfer'].includes(d.kind),signed=negative?-amount:amount;$('#entry-currency-label').textContent=a.currency;const transfer=d.kind==='transfer',dest=transfer?assetById(d.destination):null,received=dest?amount*rate(a.currency)/rate(dest.currency):0;let lines=`<div class="preview-line"><span>Current balance</span><strong>${moneyNative(m.value,a.currency,{reveal:true})} ${esc(a.currency)}</strong></div><div class="preview-line"><span>After this ${transfer?'transfer':d.kind}</span><strong class="${negative?'negative':'positive'}">${moneyNative(m.value+signed,a.currency,{reveal:true})} ${esc(a.currency)}</strong></div>`;

$('#entry-preview').innerHTML=`<div class="entry-preview">${lines}</div>`;
let explanation=transfer?'Moves money between two tracked accounts. No profit is created. Currency conversion uses your saved manual rates.':['deposit','withdrawal'].includes(d.kind)?'This is a capital movement, not trading profit. Use Transfer when moving money between two accounts already in this dashboard.':'This amount is added to or subtracted from the saved balance. Log only results not already included in that balance.';

function saveEntry(){if(modalDraft?.type!=='entry')return;entryDraftFromForm();const d=modalDraft,a=assetById(d.assetId),amount=Number(d.amount);if(!a)return formError('Select an existing account.');if(!validNumber(amount,.00000001))return formError('Enter an amount greater than zero.');if(!validDate(d.date)||d.date>today())return formError('Choose a valid date that is not in the future.');if(['loss','withdrawal','transfer'].includes(d.kind)&&amount>metrics(a).value+.00000001)return formError('This would make the account balance negative. Check the amount or update the account balance first.');if(d.kind==='transfer'){const dest=assetById(d.destination);if(!dest||dest.id===a.id)return formError('Choose a different destination account.');const received=round(amount*rate(a.currency)/rate(dest.currency));if(!validNumber(received,.00000001))return formError('The converted amount is too small or too large. Check your exchange rates.');const group=uid();appendEntry(a,'transfer_out',amount,d.date,d.note||'Transfer to '+dest.name,group);appendEntry(dest,'transfer_in',received,d.date,d.note||'Transfer from '+a.name,group);}else appendEntry(a,d.kind,amount,d.date,d.note);

async function resizeImage(file,size){if(!file||!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Choose a JPG, PNG or WebP image.');if(file.size>8*1024*1024)throw Error('Choose an image smaller than 8 MB.');const src=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('This image could not be read.'));r.readAsDataURL(file);});const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error('This image could not be opened.'));img.src=src;});if(image.width*image.height>100000000)throw Error('This image is too large. Use a smaller image.');const canvas=document.createElement('canvas');canvas.width=canvas.height=size;const ctx=canvas.getContext('2d');if(!ctx)throw Error('Your browser could not prepare the image.');const edge=Math.min(image.width,image.height);ctx.drawImage(image,(image.width-edge)/2,(image.height-edge)/2,edge,edge,0,0,size,size);return canvas.toDataURL('image/webp',.85);}
async function handleImageUpload(file,type){const draft=modalDraft;try{const image=await resizeImage(file,type==='profile'?256:128);if(modalDraft!==draft)return;if(type==='profile'){draft.photo=image;$('#profile-photo-preview').innerHTML=`<span class="avatar large"><img src="${image}" alt="New profile photo"></span>`;}else{draft.logo=image;$('#asset-logo-preview').innerHTML=`<span class="asset-logo"><img src="${image}" alt="New brand logo"></span>`;}}catch(err){formError(err.message);}}

function startFresh(){confirmAction(state.demo?'Start with your own assets?':'Clear this workspace?',`<p>This removes <strong>${state.assets.length} assets, ${state.entries.length} entries and all value history</strong> from this browser. Your profile and currency settings will stay.</p><p>Export a backup first to keep a copy. This cannot be undone from inside the app.</p>`,state.demo?'Start fresh':'Clear workspace',()=>{const oldProfile=state.profile,oldSettings=state.settings;state=blankState();state.profile=oldProfile;state.settings={...oldSettings,lastBackup:null};persistenceBlocked=false;corruptRaw='';resetFilters();closeModal();commit('Workspace cleared. Start by adding your cash balance.');});}
function resetFilters(){ui.assetFilter='all';ui.assetQuery='';ui.openMenu=null;ui.trackerAccount='';ui.trackerDate='';ui.activityAccount='';ui.activityKind='all';ui.activityQuery='';ui.activityPage=1;}
function deleteAsset(id){const a=assetById(id);if(!a)return;const entries=entriesFor(id),groups=new Set(entries.filter(e=>e.groupId).map(e=>e.groupId)),related=state.entries.filter(e=>groups.has(e.groupId)&&e.assetId!==id);const wouldDelete=new Set([...entries,...related].map(e=>e.id));
  confirmAction('Delete '+esc(a.name)+'?',`<p>This deletes the asset and <strong>${entries.length} linked ledger ${entries.length===1?'entry':'entries'}</strong>.</p>${related.length?'<p>Linked transfers in other accounts will also be reversed so no half-transfers remain.</p>':''}<p>Your total net worth will be recalculated. Export a backup before deleting records you may need.</p>`,'Delete asset',()=>{for(const other of state.assets.filter(x=>x.id!==id)){const reverse=state.entries.filter(e=>e.assetId===other.id&&wouldDelete.has(e.id)).reduce((s,e)=>s+effect(e).value,0);if(metrics(other).value-reverse<-.00000001){closeModal();toast('A linked transfer cannot be reversed because '+other.name+' no longer has enough balance. Remove dependent withdrawals or losses first.',true);return;}}state.assets=state.assets.filter(x=>x.id!==id);state.entries=state.entries.filter(e=>!wouldDelete.has(e.id));resetFilters();closeModal();commit('Asset and linked entries deleted.');});
}
function deleteEntry(id){const e=state.entries.find(e=>e.id===id);if(!e)return;const group=e.groupId?state.entries.filter(x=>x.groupId===e.groupId):[e],a=assetById(e.assetId);confirmAction(e.groupId?'Reverse this transfer?':'Delete this entry?',`<p>${e.groupId?'Both sides of this transfer will be reversed.':`The ${esc(KIND[e.kind].label.toLowerCase())} of <strong>${esc(moneyNative(e.amount,a.currency,{reveal:true}))} ${esc(a.currency)}</strong> for ${esc(a.name)} will be removed.`}</p><p>Account balances and investment totals are recalculated automatically.</p>`,'Delete & reverse',()=>{for(const asset of state.assets){const affected=group.filter(x=>x.assetId===asset.id);if(!affected.length)continue;const newBalance=metrics(asset).value-affected.reduce((s,x)=>s+effect(x).value,0);if(newBalance<-.00000001){closeModal();toast('Reversing this entry would make '+asset.name+' negative. Remove dependent withdrawals or losses first.',true);return;}}const ids=new Set(group.map(x=>x.id));state.entries=state.entries.filter(x=>!ids.has(x.id));closeModal();commit(e.groupId?'Transfer reversed. Both balances updated.':'Entry removed and balance restored.');});}
function downloadBlob(filename,text,mime='application/json'){const blob=new Blob([text],{type:mime+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);}
function exportBackup(){state.settings.lastBackup=new Date().toISOString();persist();downloadBlob('vault-backup-'+today()+'.json',JSON.stringify(state,null,2));render();toast('Backup prepared. Keep the JSON file somewhere safe.');}
function csvCell(value){let str=String(value??'');if(/^[=+@\-\t\r]/.test(str))str="'"+str;return '"'+str.replace(/"/g,'""')+'"';}
function exportCSV(){const headers=['Date','Account','Category','Included in net worth','Type','Currency','Amount (native)','Value change (native)','Capital change (native)','USDT rate at entry','Value change (USDT at entry)','Note','Entry ID','Transfer group'];const rows=[headers.map(csvCell).join(',')];for(const e of [...state.entries].sort(sortEntries)){const a=assetById(e.assetId),delta=effect(e);rows.push([e.date,a?.name||'',a?.category||'',a?.included?'Yes':'No',KIND[e.kind].label,a?.currency||'',e.amount,delta.value,delta.capital,e.fx,round(delta.value*e.fx),e.note,e.id,e.groupId].map((v,i)=>[6,7,8,9,10].includes(i)?String(v):csvCell(v)).join(','));}downloadBlob('vault-activity-'+today()+'.csv','\ufeff'+rows.join('\r\n'),'text/csv');toast('Activity CSV prepared.');}
async function importBackup(file){if(!file)return;if(file.size>12*1024*1024){toast('This backup is larger than 12 MB and cannot be loaded.',true);return;}try{const incoming=validateState(JSON.parse(await file.text()));confirmAction('Restore this backup?',`<p>This backup contains <strong>${incoming.assets.length} assets</strong> and <strong>${incoming.entries.length} ledger entries</strong>.</p><p>It will replace everything in this workspace, including your profile, rates and charts. Export your current records first.</p>`,'Restore backup',()=>{state=incoming;persistenceBlocked=false;corruptRaw='';resetFilters();closeModal();commit('Backup restored.',{snapshot:false});},false);}catch(err){toast('Import stopped: '+err.message+' Your current data is unchanged.',true);}}
function closeNav(){$('#sidebar').classList.remove('open');$('#sidebar-scrim').classList.remove('open');}
function handleAction(action,el){
  if(action==='open-nav'){$('#sidebar').classList.add('open');$('#sidebar-scrim').classList.add('open');return;}
  if(action==='close-nav'){closeNav();return;}
  if(action==='close-modal'){closeModal();return;}
  if(action==='confirm'){if(pendingExternal){closeModal();toast('The workspace changed in another tab. Review the updated data before trying again.',true);return;}const run=modalDraft?.run;if(run)run();return;}
  if(action==='profile'){openProfile();return;}

  if(action==='entry'){openEntry(el.dataset.id||'');return;}
  if(action==='asset-menu'){ui.openMenu=ui.openMenu===el.dataset.id?null:el.dataset.id;$('#asset-grid').innerHTML=assetCards();return;}
  if(action==='asset-filter'){ui.assetFilter=el.dataset.filter;ui.openMenu=null;render();return;}
  if(action==='period'){ui.period=el.dataset.period;$$('.period-selector button').forEach(b=>b.classList.toggle('active',b.dataset.period===ui.period));drawPortfolioChart();return;}
  if(action==='asset-history'){ui.activityAccount=el.dataset.id;ui.activityKind='all';ui.activityPage=1;setPage('activity');return;}
  if(action==='delete-asset'){deleteAsset(el.dataset.id);return;}
  if(action==='delete-entry'){deleteEntry(el.dataset.id);return;}
  if(action==='toggle-balances'){state.settings.hideBalances=!state.settings.hideBalances;commit('',{snapshot:false});return;}
  if(action==='start-fresh'){startFresh();return;}
  if(action==='load-demo'){confirmAction('Load sample data?','<p>This replaces your current assets and records with an illustrative demo. Your profile is kept.</p><p>Export a backup first to keep your existing data.</p>','Load sample data',()=>{const p=state.profile;state=sampleState();state.profile=p;resetFilters();persistenceBlocked=false;corruptRaw='';closeModal();commit('Sample workspace loaded. These are not your real balances.');});return;}
  if(action==='entry-kind'){entryDraftFromForm();modalDraft.kind=el.dataset.kind;if(modalDraft.kind==='transfer'&&modalDraft.destination===modalDraft.assetId)modalDraft.destination=state.assets.find(a=>a.id!==modalDraft.assetId)?.id||'';renderEntryForm();return;}
  if(action==='calculate-value'){const units=$('#asset-units'),price=$('#asset-unit-price');if(units.value===''||price.value==='')return formError('Enter a quantity and a unit price first.');const value=Number(units.value)*Number(price.value);if(!validNumber(value,0))return formError('The calculated value is too large or invalid.');$('#asset-current').value=round(value);$('#form-error').textContent='';toast('Current value filled from quantity x price.');return;}
  if(action==='remove-logo'){if(modalDraft?.type==='asset'){modalDraft.logo='';$('#asset-logo-file').value='';$('#asset-logo-preview').innerHTML=assetLogo({category:$('#asset-category').value,name:'Asset',symbol:$('#asset-symbol').value,logo:''});}return;}
  if(action==='remove-photo'){if(modalDraft?.type==='profile'){modalDraft.photo='';$('#profile-photo-file').value='';$('#profile-photo-preview').innerHTML=`<span class="avatar large">${esc(state.profile.name.slice(0,1).toUpperCase())}</span>`;}return;}
  if(action==='month'){ui.month=new Date(ui.month.getFullYear(),ui.month.getMonth()+Number(el.dataset.delta),1);ui.trackerDate='';render();return;}
  if(action==='calendar-day'){ui.trackerDate=ui.trackerDate===el.dataset.date?'':el.dataset.date;render();return;}
  if(action==='clear-day'){ui.trackerDate='';render();return;}
  if(action==='activity-page'){ui.activityPage+=Number(el.dataset.delta);$('#activity-content').innerHTML=activityContents();return;}
  if(action==='export'){exportBackup();return;}
  if(action==='export-csv'){exportCSV();return;}
  if(action==='import'){$('#import-file').click();return;}
  if(action==='open-backup'){setPage('settings');setTimeout(()=>$('#backup-section')?.scrollIntoView({behavior:'smooth',block:'start'}),50);return;}
  if(action==='recovery'){downloadBlob('vault-recovery-'+today()+'.json',corruptRaw||'{}');return;}
  if(action==='add-currency'){openCurrency();return;}
  if(action==='delete-currency'){const c=el.dataset.currency;if(c==='USDT')return;if(state.assets.some(a=>a.currency===c)){toast('This currency is used by an asset and cannot be removed.',true);return;}confirmAction('Remove '+esc(c)+'?','<p>No assets use this currency. Its manual conversion rate will be removed.</p>','Remove currency',()=>{delete state.settings.rates[c];if(state.settings.displayCurrency===c)state.settings.displayCurrency='USDT';closeModal();commit('Currency removed.',{snapshot:false});});return;}
  if(action==='returns-help'){infoModal('Understanding your returns','<p><strong>Gain / loss = current value - net contributed capital.</strong> Withdrawals reduce net contributed capital, so withdrawing money is not treated as a loss.</p><p>For each asset, percentage return divides gain by opening capital plus later deposits and transfers in. The headline return uses opening capital plus external deposits, avoiding double-counting transfers between accounts.</p><p>Cash and excluded assets are left out of the comparison chart. A percentage is unavailable when contributed capital is zero.</p><p>Conversions use your saved manual rates. These are simple bookkeeping comparisons, not time-weighted, tax or audited performance calculations.</p>');return;}
  if(action==='help'){infoModal('A clear view of your assets','<p><strong>1. Start with your own data.</strong> Remove the labeled sample workspace, then add your cash, trading accounts and investments.</p><p><strong>2. Set a starting value.</strong> Enter what you invested and what the account is worth now. Add a logo and select its currency.</p><p><strong>3. Keep it current.</strong> Log a profit or loss to adjust a balance. Use deposits and withdrawals for new money, or Transfer to move cash between tracked accounts. Editing current value records a separate valuation update, not daily trading profit.</p><p><strong>4. Keep a backup.</strong> Your data stays in this browser. It does not sync across devices, and clearing browser storage removes it. Export a JSON backup regularly.</p><p>There are no live prices or exchange connections. This dashboard does not ask for credentials, bank details or crypto keys. The gold badge is decorative, not external verification.</p>');return;}
}
document.addEventListener('click',event=>{const page=event.target.closest('[data-page]');if(page){event.preventDefault();setPage(page.dataset.page);return;}const action=event.target.closest('[data-action]');if(action){event.preventDefault();handleAction(action.dataset.action,action);return;}if(ui.openMenu&&!event.target.closest('.asset-menu')){ui.openMenu=null;const grid=$('#asset-grid');if(grid)grid.innerHTML=assetCards();}});
document.addEventListener('input',event=>{if(['entry-amount','entry-note','entry-date'].includes(event.target.id))updateEntryPreview();});
document.addEventListener('change',event=>{const t=event.target,id=t.id;
  if(id==='display-currency'||id==='setting-display'){state.settings.displayCurrency=t.value;commit('',{snapshot:false});}
  else if(id==='setting-badge'){state.profile.badge=t.checked;commit('',{snapshot:false});}
  else if(id==='setting-hide'){state.settings.hideBalances=t.checked;commit('',{snapshot:false});}
  else if(id==='asset-logo-file'&&t.files[0])handleImageUpload(t.files[0],'asset');
  else if(id==='profile-photo-file'&&t.files[0])handleImageUpload(t.files[0],'profile');
  else if(id==='asset-category'){if(!modalDraft.includedTouched)$('#asset-included').checked=t.value!=='prop';if(!modalDraft.logo)$('#asset-logo-preview').innerHTML=assetLogo({category:t.value,name:'Asset',symbol:$('#asset-symbol').value,logo:''});if(t.value==='crypto')$('.quantity-details').open=true;}
  else if(id==='asset-included'){modalDraft.includedTouched=true;}
  else if(id==='asset-currency'){const custom=t.value==='__custom__';$('#custom-currency-fields').classList.toggle('hidden',!custom);$('#custom-code').required=custom;$('#custom-rate').required=custom;$$('.form-currency').forEach(el=>el.textContent=custom?'New currency':t.value);}
  else if(id==='entry-account'){entryDraftFromForm();if(modalDraft.kind==='transfer'){if(modalDraft.destination===t.value)modalDraft.destination=state.assets.find(a=>a.id!==t.value)?.id||'';renderEntryForm();}else updateEntryPreview();}
  else if(id==='entry-destination'||id==='entry-date'){updateEntryPreview();}
  else if(id==='tracker-account'){ui.trackerAccount=t.value;ui.trackerDate='';render();}
  else if(id==='activity-account'){ui.activityAccount=t.value;ui.activityPage=1;$('#activity-content').innerHTML=activityContents();}
  else if(id==='activity-kind'){ui.activityKind=t.value;ui.activityPage=1;$('#activity-content').innerHTML=activityContents();}
  else if(id==='import-file'){importBackup(t.files[0]);t.value='';}
});
document.addEventListener('submit',event=>{event.preventDefault();if(pendingExternal){formError('Another tab changed this workspace. Close this form, then reopen it with the latest data.');return;}const form=event.target;if(!form.reportValidity())return;
  if(form.id==='asset-form')saveAsset();
  else if(form.id==='entry-form')saveEntry();
  else if(form.id==='profile-form'){const name=$('#profile-name').value.trim();if(!name)return formError('Please enter your display name.');state.profile={name,subtitle:$('#profile-subtitle').value.trim()||'Personal portfolio',photo:modalDraft.photo,badge:$('#profile-badge').checked};closeModal();commit('Profile updated.',{snapshot:false});}
  else if(form.id==='currency-form'){const code=$('#currency-code').value.trim().toUpperCase(),r=Number($('#currency-rate').value);if(!/^[A-Z][A-Z0-9]{1,9}$/.test(code))return formError('Use a currency code such as EUR, AED or INR.');if(Object.hasOwn(state.settings.rates,code))return formError('This currency already exists. Update it in Settings instead.');if(!validNumber(r,1e-12,1e12))return formError('Enter a positive conversion rate.');state.settings.rates[code]=r;closeModal();commit('Currency added. You can now select it for an asset.');}
  else if(form.id==='rates-form'){const next={...state.settings.rates};for(const el of $$('[data-rate]',form)){const value=Number(el.value);if(!validNumber(value,1e-12,1e12)){toast('All exchange rates must be positive numbers.',true);return;}next[el.dataset.rate]=value;}state.settings.rates=next;commit('Conversion rates saved. Your USDT totals are updated.');}
});
$('#modal').addEventListener('click',event=>{if(event.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal();}});
$('#modal').addEventListener('close',()=>{modalDraft=null;if(pendingExternal){state=pendingExternal;pendingExternal=null;resetFilters();render();toast('Latest workspace loaded from the other tab.');}});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(['overview','tracker','activity','settings'].includes(p)&&ui.page!==p){ui.page=p;render();}});
window.addEventListener('beforeunload',event=>{if(!storageOk){event.preventDefault();event.returnValue='Unsaved changes. Export a backup before leaving.';}});
window.addEventListener('storage',event=>{if(event.key!==STORAGE_KEY||!event.newValue)return;try{const updated=validateState(JSON.parse(event.newValue));if($('#modal').open){pendingExternal=updated;formError('This workspace changed in another tab. Close this form to load the latest version.');toast('Another tab updated this workspace. Close this form before continuing.',true);return;}state=updated;render();toast('Workspace updated from another tab.');}catch(err){toast('Another tab changed the saved data, but it could not be read.',true);}});
render();
if(!storageOk)setTimeout(()=>toast(persistenceBlocked?'Saved data needs recovery. It has not been overwritten. Open Settings.':'Browser saving is unavailable. Use Export JSON to keep your work.',true),600);
})();

</script>
</body>
</html>
