<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Vault - Personal Asset Manager</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 3v17h17M8 15l4-5 4 3 5-8"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="m10 3-.5 2-2 .9L5.5 5 3 9l1.6 1.5v3L3 15l2.5 4 2-.9 2 .9.5 2h4l.5-2 2-.9 2 .9 2.5-4-1.6-1.5v-3L21 9l-2.5-4-2 .9-2-.9L14 3Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-wallet" viewBox="0 0 24 24"><path d="M20 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15v12H5a2 2 0 0 1-2-2V6"/><path d="M20 12h-5v4h5M17 14h.01"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="m7 17 10-10M7 7h10v10"/></symbol>
<symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="m7 7 10 10M7 17h10V7"/></symbol>
<symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-eye-off" viewBox="0 0 24 24"><path d="m3 3 18 18M9.5 5.3A12 12 0 0 1 12 5c6.5 0 10 7 10 7a20 20 0 0 1-3 3.8M6 6C3.5 8 2 12 2 12s3.5 7 10 7a12 12 0 0 0 5-1.1"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="m16 3 5 5-12 12-6 1 1-6ZM14 5l5 5"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M3 16v5h18v-5"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M3 17v4h18v-4"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6ZM8 12l3 3 5-6"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.01"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></symbol>
<symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></symbol>
<symbol id="i-transfer" viewBox="0 0 24 24"><path d="M3 7h18l-4-4M21 17H3l4 4"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V4h7l3 3h8v14H3Z"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v12M15 9c-1-2-6-2-6 1s6 1 6 4-5 3-6 1"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
</defs></svg>
<div id="sidebar-scrim" class="sidebar-scrim" data-action="close-nav"></div>
<aside class="sidebar" id="sidebar">
<a class="brand" href="#overview" aria-label="Vault overview"><span class="brand-mark"><svg viewBox="0 0 32 32"><path d="M3 6h9l5 9 5-9h7L17 28Z" fill="currentColor"/><path d="m3 6 14 22-4-15Z" fill="#86b6ff"/></svg></span>vault<span class="brand-dot">.</span></a>
<div class="workspace-tag">PERSONAL WORKSPACE</div>
<nav aria-label="Main navigation">
<button class="nav-item active" data-page="overview"><svg class="icon"><use href="#i-grid"/></svg><span>Overview</span><span class="nav-active-dot"></span></button>
<button class="nav-item" data-page="tracker"><svg class="icon"><use href="#i-chart"/></svg><span>Daily tracker</span></button>
<button class="nav-item" data-page="activity"><svg class="icon"><use href="#i-clock"/></svg><span>Activity log</span></button>
<div class="nav-heading">YOUR WORKSPACE</div>
<button class="nav-item" data-page="settings"><svg class="icon"><use href="#i-settings"/></svg><span>Settings</span></button>
<button class="nav-item" data-action="open-backup"><svg class="icon"><use href="#i-folder"/></svg><span>Backup &amp; restore</span></button>
</nav>
<div class="sidebar-bottom"><div class="local-card"><span class="local-card-icon"><svg class="icon"><use href="#i-shield"/></svg></span><strong>Your assets. Your space.</strong><p>Private to this browser.<br>No account connections.</p><button class="text-link" data-action="export">Create a backup <svg class="icon"><use href="#i-arrow-right"/></svg></button></div><button class="sidebar-profile" data-action="profile" id="sidebar-profile"></button></div>
</aside>
<div class="app-shell">
<header class="topbar"><div class="topbar-left"><button class="icon-button mobile-menu" data-action="open-nav" aria-label="Open navigation"><svg class="icon"><use href="#i-menu"/></svg></button><span class="breadcrumb">Workspace <span>/</span> <strong id="breadcrumb-current">Overview</strong></span></div><div class="topbar-right"><span class="save-status" id="save-status"><span></span> Saved on this device</span><div class="currency-control"><svg class="icon"><use href="#i-globe"/></svg><select id="display-currency" aria-label="Display currency"></select></div><button class="icon-button help-button" data-action="help" aria-label="How this dashboard works"><svg class="icon"><use href="#i-info"/></svg></button></div></header>
<main id="main" tabindex="-1"></main>
<footer class="app-footer"><span><span class="footer-dot"></span> A little more clarity. A lot more control.</span><span>Manual valuations <span class="footer-separator">/</span> No live prices</span></footer>
</div>
<div class="toast-region" id="toasts" aria-live="polite" aria-atomic="true"></div>
<dialog id="modal" class="modal"><div id="modal-content"></div></dialog>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<script src="app.js"></script>
</body>
</html>
