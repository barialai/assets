/* Brand refinements. The uploaded logo geometry and white fill are unchanged. */
html{scrollbar-color:#4B4B46 var(--obsidian-root)}
::selection{background:#FCFF1A44;color:var(--text)}
.sidebar{border-right-color:var(--border)}
.brand{gap:11px;letter-spacing:-1.4px;padding-left:12px;align-items:center}
.brand-mark{width:32px;height:38px;display:inline-flex;align-items:center;flex-shrink:0}
.brand-mark svg{display:block;width:100%;height:100%;fill:none}
.brand-dot{margin-left:-8px;color:var(--accent)}
.mobile-brand{display:none;width:19px;height:25px;flex-shrink:0;align-items:center;text-decoration:none}
.mobile-brand svg{display:block;width:100%;height:100%}
.topbar{background:var(--obsidian-root);border-bottom-color:var(--border)}
.breadcrumb,.date-label{color:var(--muted)}
.breadcrumb strong{color:var(--text)}
.workspace-tag,.nav-heading{color:var(--faint)}
.nav-item{color:var(--muted)}
.nav-item:hover{background:#FFFFFF07;color:var(--text)}
.nav-item.active{background:#FCFF1A0D;color:var(--accent)}
.local-card{background:var(--panel);border-color:var(--border)}
.local-card p,.sidebar-profile small{color:var(--faint)}
.avatar{background:#FCFF1A0C;border-color:#FCFF1A2E;color:var(--accent)}
.private-tag,.small-tag,.section-count{background:#1C1C1C;border-color:var(--border);color:var(--muted)}
.btn{color:var(--text)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--obsidian-root);box-shadow:none;font-weight:650}
.btn-primary:hover{background:var(--accent);color:var(--obsidian-root);box-shadow:0 0 0 3px #FCFF1A1C}
.btn-primary:active{box-shadow:none}
.btn-secondary{background:#171717;border-color:#343434}
.btn-secondary:hover{background:#242424}
.btn-danger{background:#292929;border-color:#77776E;color:var(--text)}
.btn-danger:hover{background:#363636}
.text-link,.demo-banner button{color:var(--accent)}
.demo-banner{background:#FCFF1A06;border-color:#FCFF1A24;color:var(--muted)}
.demo-banner strong{color:var(--text)}
.hero{background:radial-gradient(ellipse at 90% 0%,#FCFF1A09,transparent 62%),var(--panel);border-color:#32332A}
.hero-total .number{color:var(--text)}
.hero-label,.hero-sub,.hero-total .unit{color:var(--muted)}
.hero-metrics{border-color:#FFFFFF12}
.metric-label,.chart-topline,.chart-foot,.chart-foot span:last-child{color:var(--faint)}
.change-badge{background:#FCFF1A12;color:var(--accent)}
.change-badge.negative{background:#FFFFFF09;color:var(--negative)}
.change-badge.neutral{background:#FFFFFF05;color:var(--muted)}
.period-selector button{color:var(--faint)}
.period-selector button.active{color:var(--accent);background:#FCFF1A0C;border-color:#FCFF1A2D}
.chart-tooltip{background:#1D1D1B;border-color:#4A4A3E;color:var(--text)}
.chart-tooltip small{color:var(--muted)}
.tab{color:var(--muted)}
.tab.active{background:#FCFF1A0B;color:var(--accent);border-color:#FCFF1A2B}
.tab:hover{color:var(--text)}
.asset-card{background:var(--panel);border-color:var(--border)}
.asset-card:hover{border-color:#FCFF1A38}
.asset-name{color:var(--text)}
.asset-meta,.asset-total small,.asset-gain-label,.asset-bottom,.panel-heading p{color:var(--faint)}
.asset-divider{background:var(--border)}
.asset-logo,.asset-logo.cash,.asset-logo.other{background:#202020;border-color:#363636;color:var(--text)}
.asset-logo.forex,.asset-logo.crypto{background:#FCFF1A0B;border-color:#FCFF1A22;color:var(--accent)}
.asset-log-button{background:#FCFF1A0B;color:var(--accent)}
.asset-log-button:hover{background:#FCFF1A1C}
.asset-menu{background:#1D1D1D;border-color:#3D3D3D}
.asset-menu button.danger{color:var(--text)}
.empty-card{background:#10110F;border-color:#3A3C32;color:var(--muted)}
.empty-card:hover{color:var(--accent);border-color:var(--accent)}
.empty-card>span{background:#FCFF1A0C;color:var(--accent)}
.empty-card small{color:var(--faint)}
.return-track{background:linear-gradient(to right,transparent calc(40% - .5px),#69695E 40%,transparent calc(40% + .5px)),linear-gradient(to right,transparent calc(70% - .5px),#FFFFFF0C 70%,transparent calc(70% + .5px))}
.return-bar{background:var(--accent)}
.return-bar.loss{background:repeating-linear-gradient(135deg,#ABABA2 0px,#ABABA2 3px,#74746B 3px,#74746B 5px)}
.return-val{color:var(--accent)}
.return-axis,.calendar-weekday,.calendar-key{color:var(--faint)}
.type-pill{background:#FCFF1A0B;color:var(--accent)}
.type-pill.loss{background:#FFFFFF0A;color:var(--negative)}
.type-pill.neutral{background:#FFFFFF06;color:var(--muted)}
.table-account small,.note-cell,.table-footer,.daily-summary,.app-footer{color:var(--faint)}
.calendar-day{background:#1A1A1A;border-color:#2D2D2D;color:var(--muted)}
.calendar-day.profit{background:#FCFF1A0B;border-color:#FCFF1A26}
.calendar-day.loss{background:repeating-linear-gradient(135deg,#FFFFFF04 0px,#FFFFFF04 5px,#FFFFFF01 5px,#FFFFFF01 9px);border-color:#55554D}
.calendar-day:hover{border-color:#91916E}
.calendar-day.today{border-color:var(--accent)}
.calendar-day.selected{outline:1px solid var(--accent);outline-offset:2px;background:#FCFF1A13;border-color:var(--accent)}
.calendar-key i{background:var(--accent)}

.input,input.input,select.input,textarea.input{background:var(--obsidian-root);border-color:#3A3A36;color:var(--text);caret-color:var(--accent)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #FCFF1A12}
.input::placeholder{color:#808078}
.input:disabled{background:#1B1B1B;color:var(--faint)}
.toggle-track{background:#474740}
.toggle-track:after{background:#EBEBE2}
.toggle input:checked+.toggle-track{background:var(--accent)}
.toggle input:checked+.toggle-track:after{background:var(--obsidian-root)}
.toggle input:focus-visible+.toggle-track{outline-color:var(--accent)}
.inline-note{background:#FCFF1A07;border-color:#FCFF1A24;color:var(--muted)}
.inline-note .icon{color:var(--accent)}
.inline-note.warning{background:#FCFF1A0A;border-color:#FCFF1A4D;color:var(--text)}
.modal{background:var(--panel);border-color:#3D3D35;color:var(--text)}
.modal-header p{color:var(--muted)}
.modal-footer{background:#171717;border-color:var(--border)}
.upload-row{background:var(--obsidian-root);border-color:#515143}
.image-input::file-selector-button{background:#FCFF1A0E;border-color:#FCFF1A33;color:var(--accent)}
.entry-type{background:#1B1B1B;border-color:#363632;color:var(--muted)}
.entry-type.active{background:#FCFF1A0F;border-color:var(--accent);color:var(--accent)}
.entry-type.active[data-kind=loss]{background:#FFFFFF0B;color:var(--text);border-color:#D7D7CD}
.entry-preview{background:var(--obsidian-root);border-color:#3C3E2C}
.preview-line{color:var(--muted)}
.preview-line strong{color:var(--text)}
.preview-line:first-child strong{color:var(--accent)}
.form-error{background:#FCFF1A09;border-color:#FCFF1A66;color:var(--text)}
.toast{background:#1C1D16;border-color:#FCFF1A44;color:var(--text)}
.toast .icon,.toast.error .icon{color:var(--accent)}
.toast.error{background:#22221A;border-color:var(--accent);color:var(--text)}
.quantity-details{background:var(--obsidian-root);border-color:#3C3C34}
.quantity-details>summary{color:var(--text)}
.quantity-details>summary>span{color:var(--faint)}
.quantity-details[open]>summary{border-bottom-color:var(--border)}
.asset-exclusion{color:var(--muted)}
.checkbox-line input{accent-color:var(--accent)}

/* V3: date selection, portable backups and a touch-first mobile workspace. */
:root{--safe-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{touch-action:manipulation}
body.modal-open{overflow:hidden}
.mobile-bottom-nav{display:none}
.top-backup{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--muted)}
.top-backup:hover{color:var(--accent);border-color:#FCFF1A44}
.top-backup .icon{width:16px;height:16px}
.local-card{background:var(--panel)}
.local-card-actions{display:flex;flex-direction:column;gap:12px}
.local-card .local-restore{color:var(--muted);font-size:11px}
.local-card .local-restore:hover{color:var(--accent)}
.backup-entry-banner{display:flex;align-items:center;justify-content:space-between;gap:15px;background:#FCFF1A08;border:1px solid #FCFF1A24;border-radius:12px;padding:14px 17px;margin-bottom:18px}
.backup-entry-banner>div{display:flex;align-items:center;gap:11px}
.backup-entry-banner .icon{color:var(--accent);flex-shrink:0}
.backup-entry-banner strong{display:block;color:var(--text);font-size:12px;font-weight:550}
.backup-entry-banner p{margin:4px 0 0;font-size:10px;color:var(--muted);line-height:1.5}
.backup-entry-banner .btn{font-size:11px}
/* All date values stay in their original fields, preserving ledger semantics. */
.date-control{position:relative;width:100%;min-width:0}
.date-native{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;min-height:0!important;border:0!important;opacity:0;overflow:hidden;clip-path:inset(50%);pointer-events:none}
.date-trigger{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:1px solid #3A3A36;background:var(--obsidian-root);border-radius:9px;color:var(--text);padding:11px 13px;min-height:43px;font-size:12px}
.date-trigger .date-placeholder{color:#96968B}
.date-trigger .icon{width:17px;height:17px;color:var(--accent)}
.date-trigger:hover:not(:disabled){border-color:#FCFF1A70;background:#FCFF1A05}
.date-trigger[aria-expanded=true]{border-color:var(--accent);box-shadow:0 0 0 3px #FCFF1A0C}
.date-trigger:disabled{opacity:.5}
.date-picker{position:fixed;inset:auto;box-sizing:border-box;width:358px;max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);margin:0;padding:0;border:1px solid #454638;border-radius:18px;background:#141414;color:var(--text);overflow:auto;box-shadow:0 25px 80px #0009}
.date-picker::backdrop{background:#0005}
.dp-head{padding:20px 21px 17px;display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--border)}
.dp-eyebrow{font-size:9px;letter-spacing:1.9px;font-weight:650;color:var(--accent);margin:0 0 7px}
.dp-head h2{font-size:17px;letter-spacing:-.4px;font-weight:600;margin:0}
.dp-head .icon-button{margin:-4px -5px 0 0}
.dp-body{padding:16px 17px 0}
.dp-month-bar{display:flex;align-items:center;gap:6px;justify-content:space-between;margin-bottom:15px}
.dp-month-selects{display:flex;gap:2px;flex:1;align-items:center;justify-content:center}
.dp-month-selects select{font-size:13px;font-weight:550;border:0;border-radius:6px;background:#20211B;color:var(--text);padding:9px 4px;min-width:0;cursor:pointer;max-width:130px}
.dp-month-selects select:last-child{max-width:85px}
.dp-month-bar>.icon-button{width:35px;height:35px;background:#1D1D1B;border:1px solid #34352F}
.dp-month-bar>.icon-button:first-child .icon{transform:rotate(180deg)}
.dp-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;padding-bottom:8px}
.dp-weekdays span{text-align:center;font-size:10px;color:var(--faint);font-weight:500}
.dp-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dp-day{position:relative;min-width:0;height:39px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--text);font-size:12px;font-variant-numeric:tabular-nums}
.dp-day.other-month{color:#8A8B80}
.dp-day:hover:not(:disabled){background:#282A1F;border-color:#4D5034}
.dp-day:disabled{color:#53534D;opacity:.7}
.dp-day.is-today{border-color:#FCFF1A80;color:var(--accent)}
.dp-day.selected{background:var(--accent)!important;border-color:var(--accent)!important;color:var(--obsidian-root)!important;font-weight:750;box-shadow:0 3px 14px #FCFF1A1C}
.dp-day:focus-visible{outline-offset:0;outline-width:2px}
.dp-presets{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--border);margin-top:14px;padding-top:13px}
.dp-presets button{background:#1E2018;border:1px solid #36392A;color:#CBCDC0;border-radius:6px;padding:8px 10px;font-size:10px;min-height:33px}
.dp-presets button:hover{border-color:#FCFF1A80;color:var(--accent)}
.dp-selection{font-size:11px;color:var(--muted);line-height:1.6;min-height:37px;margin:12px 0 0;display:flex;align-items:center;gap:6px}
.dp-selection .icon{width:14px;height:14px;color:var(--accent)}
.dp-footer{display:flex;align-items:center;gap:7px;padding:13px 17px 16px;border-top:1px solid var(--border);background:#171812;position:sticky;bottom:0}
.dp-footer .btn{min-height:39px;font-size:11px}
.dp-footer .dp-clear{margin-right:auto;color:var(--muted);background:none;border:0;padding:8px 4px;font-size:11px;min-height:39px}
.dp-footer .dp-clear:disabled{opacity:.45}
.dp-footer .dp-apply{flex:1}
.dp-month-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 17px}
.dp-month-choice{border:1px solid #33352D;background:#1B1D16;border-radius:9px;min-height:49px;font-size:12px;color:var(--muted)}
.dp-month-choice.selected{background:var(--accent);color:var(--obsidian-root);font-weight:650;border-color:var(--accent)}
.filter-row>.date-control{width:185px;flex:0 0 auto}
/* A dedicated, device-independent backup center. */
.backup-hero{display:flex;justify-content:space-between;align-items:flex-start;gap:25px;margin:4px 0 27px}
.backup-hero h1{font-size:32px;font-weight:560;letter-spacing:-1.2px;line-height:1.17;margin:9px 0 12px}
.backup-hero p{font-size:12px;line-height:1.8;color:var(--muted);max-width:565px;margin:0}
.backup-hero-icon{width:76px;height:76px;display:flex;align-items:center;justify-content:center;border:1px solid #FCFF1A30;background:#FCFF1A08;border-radius:22px;flex-shrink:0}
.backup-hero-icon .icon{width:34px;height:34px;color:var(--accent);stroke-width:1.3}
.backup-status-strip{display:flex;gap:25px;flex-wrap:wrap;align-items:center;border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:15px 19px;margin-bottom:22px;color:var(--muted);font-size:11px}
.backup-status-strip span{display:flex;align-items:center;gap:8px}
.backup-status-strip .icon{color:var(--accent);width:15px;height:15px}
.backup-status-strip strong{color:var(--text);font-weight:500}
.backup-grid{display:grid;grid-template-columns:1fr 1fr;gap:19px;margin-bottom:25px}
.backup-card{padding:26px;display:flex;flex-direction:column;position:relative;border:1px solid var(--border);border-radius:17px;background:var(--panel);min-width:0}
.backup-card.download-card{border-color:#FCFF1A4A;background:linear-gradient(135deg,#FCFF1A07,transparent 60%),var(--panel)}
.backup-card-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}
.backup-icon{width:45px;height:45px;display:flex;align-items:center;justify-content:center;background:#FCFF1A0B;border:1px solid #FCFF1A26;color:var(--accent);border-radius:12px}
.backup-icon .icon{width:21px;height:21px}
.backup-step-label{color:var(--faint);font-size:9px;letter-spacing:1.7px;font-weight:550}
.backup-card h2{font-size:21px;font-weight:550;letter-spacing:-.6px;margin:0 0 10px}
.backup-card>p{font-size:12px;color:var(--muted);line-height:1.85;margin:0 0 20px;max-width:430px}
.backup-content-list{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;margin-bottom:24px;color:var(--muted);font-size:11px}
.backup-content-list span{display:flex;align-items:center;gap:8px}
.backup-content-list .icon{color:var(--accent);width:13px;height:13px}
.backup-card-bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.backup-card-bottom .btn{width:100%;min-height:43px;font-size:12px}
.backup-card-bottom .backup-file-caption{font-size:10px;color:var(--faint);line-height:1.6;text-align:center;margin:0}
.backup-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px dashed #555744;border-radius:11px;padding:21px 15px;background:var(--obsidian-root);gap:8px;margin-bottom:17px;width:100%;color:var(--text)}
.backup-drop>.icon{width:25px;height:25px;color:var(--accent);margin-bottom:4px}
.backup-drop strong{font-size:12px;font-weight:500}
.backup-drop span{font-size:10px;color:var(--faint)}
.backup-drop:hover,.backup-drop.drag-over{border-color:var(--accent);background:#FCFF1A08}
.backup-bottom-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:19px;margin-bottom:28px}
.backup-bottom-grid .panel h3{font-size:14px;font-weight:550;margin:0 0 8px}
.backup-bottom-grid .panel>p{font-size:11px;line-height:1.8;color:var(--muted);margin:0 0 15px}
.backup-how{display:flex;flex-direction:column;gap:20px;margin:21px 0 9px}
.backup-how-step{display:flex;align-items:flex-start;gap:13px}

function applyRestore(){

  if(draft?.type!=='restore'||!$('#restore-confirm')?.checked)return;
  if(pendingExternal)return formError('Another tab changed this workspace. Close this preview and open the backup again.');
  if(draft.original!==JSON.stringify(state)){
    // A download updates only backup timestamps. Any ledger changes invalidate the preview.
    const before=JSON.parse(draft.original),now=JSON.parse(JSON.stringify(state));
    before.updatedAt=now.updatedAt;before.settings.lastBackup=now.settings.lastBackup;
    if(JSON.stringify(before)!==JSON.stringify(now))return formError('The current workspace changed. Close this preview and review the backup again.');
  }
  const keep=$('#restore-keep-copy')?.checked||false;
  const next=validateState(draft.incoming);
  try{
    if(keep){const raw=corruptRaw||JSON.stringify(state);localStorage.setItem(RECOVERY_KEY,JSON.stringify({savedAt:new Date().toISOString(),raw}));}
    // localStorage writes are atomic. Do not replace the active state unless saving succeeds.
    localStorage.setItem(STORAGE_KEY,JSON.stringify(next));
  }catch(err){return formError('Restore stopped: this browser could not save the workspace. Your current records are unchanged. Download the current backup, then free browser storage or use a regular browser window. If only the extra recovery copy is too large, uncheck it after downloading your current backup.');}
  state=next;storageOk=true;persistenceBlocked=false;corruptRaw='';pendingExternal=null;resetFilters();
  closeModal();setPage('overview');
  toast('Workspace restored. Your saved accounts, loans, pictures and history are ready.');
}

}
function pickerValueAllowed(value){
  const p=pickerSession;if(!p)return false;
  if(p.mode==='month'?!/^\d{4}-(0[1-9]|1[0-2])$/.test(value):!validDate(value))return false;
  return (!p.min||value>=p.min)&&(!p.max||value<=p.max);
}
function pickerMonthAllowed(y,m){
  const p=pickerSession,key=`${String(y).padStart(4,'0')}-${String(m+1).padStart(2,'0')}`;
  return y>=1&&y<=9999&&(!p.min||key>=p.min.slice(0,7))&&(!p.max||key<=p.max.slice(0,7));
}
function openDatePicker(id){

  const d=dateObj(mode==='month'?initial+'-01':initial);

  const dialog=$('#date-picker');dialog.innerHTML='';renderDatePicker();
  document.getElementById(id+'-trigger')?.setAttribute('aria-expanded','true');
  document.body.classList.add('modal-open');dialog.showModal();positionDatePicker();
  requestAnimationFrame(()=>{const target=$('[tabindex="0"]',dialog)||$('.dp-apply',dialog);target?.focus({preventScroll:true});});
}
function renderDatePicker(){
  const p=pickerSession;if(!p)return;
  const firstYear=p.min?Number(p.min.slice(0,4)):Math.min(1900,p.year),lastYear=p.max?Number(p.max.slice(0,4)):Math.max(2100,p.year);
  const years=Array.from({length:Math.max(1,lastYear-firstYear+1)},(_,i)=>firstYear+i);
  const prev=new Date(p.year,p.month-1,1),next=new Date(p.year,p.month+1,1);
  let selection=p.value?dateDisplay(p.value,p.mode):'No date selected';
  const yearOptions=years.map(y=>`<option value="${y}" ${y===p.year?'selected':''}>${y}</option>`).join('');
  const monthOptions=MONTH_NAMES.map((name,m)=>`<option value="${m}" ${m===p.month?'selected':''} ${pickerMonthAllowed(p.year,m)?'':'disabled'}>${name}</option>`).join('');
  let calendar='',presets=[];
  if(p.mode==='date'){
    const first=new Date(p.year,p.month,1,12),offset=(first.getDay()+6)%7,start=new Date(p.year,p.month,1-offset,12),daysInMonth=new Date(p.year,p.month+1,0).getDate(),cells=Math.ceil((offset+daysInMonth)/7)*7;
    const focus=p.focus&&pickerValueAllowed(p.focus)?p.focus:p.value||localDate(first);
    calendar='<div class="dp-weekdays" aria-hidden="true">'+['M','T','W','T','F','S','S'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="dp-grid" role="group" aria-label="'+MONTH_NAMES[p.month]+' '+p.year+'">';
    for(let i=0;i<cells;i++){
      const d=new Date(start);d.setDate(start.getDate()+i);const key=localDate(d),selected=key===p.value,allowed=pickerValueAllowed(key);
      calendar+=`<button type="button" class="dp-day ${d.getMonth()!==p.month?'other-month':''} ${key===today()?'is-today':''} ${selected?'selected':''}" data-dp-date="${key}" ${allowed?'':'disabled'} tabindex="${key===focus&&allowed?0:-1}" aria-label="${esc(d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))}" aria-pressed="${selected}" ${key===today()?'aria-current="date"':''}>${d.getDate()}</button>`;
    }
    calendar+='</div>';
    presets=(p.max&&p.max<=today()?[[today(),'Today'],[shiftDate(-1),'Yesterday'],[shiftDate(-7),'7 days ago']]:[[today(),'Today'],[shiftDate(1),'Tomorrow'],[shiftDate(7),'+7 days'],[shiftDate(30),'+30 days']]).filter(([v])=>pickerValueAllowed(v));
  }else{
    calendar='<div class="dp-month-grid" role="group" aria-label="Choose a month">'+MONTH_NAMES.map((name,m)=>{const key=`${String(p.year).padStart(4,'0')}-${String(m+1).padStart(2,'0')}`;return `<button type="button" class="dp-month-choice ${key===p.value?'selected':''}" data-dp-month="${key}" tabindex="${key===(p.focus||p.value)?0:-1}" ${pickerValueAllowed(key)?'':'disabled'} aria-pressed="${key===p.value}">${name.slice(0,3)}</button>`;}).join('')+'</div>';
    const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);
    presets=[[today().slice(0,7),'This month'],[localDate(d).slice(0,7),'Last month']].filter(([v])=>pickerValueAllowed(v));
  }
  const prevAllowed=p.mode==='month'?p.year>firstYear:pickerMonthAllowed(prev.getFullYear(),prev.getMonth()),nextAllowed=p.mode==='month'?p.year<lastYear:pickerMonthAllowed(next.getFullYear(),next.getMonth());
  $('#date-picker').innerHTML=`<div class="dp-head"><div><div class="dp-eyebrow">${p.mode==='month'?'SELECT MONTH':'SELECT DATE'}</div><h2 id="dp-title">${esc(p.input.dataset.dateLabel||'Choose a date')}</h2></div><button type="button" class="icon-button" data-dp="cancel" aria-label="Close date picker">${icon('close')}</button></div><div class="dp-body"><div class="dp-month-bar"><button type="button" class="icon-button" data-dp="previous" aria-label="Previous ${p.mode==='month'?'year':'month'}" ${prevAllowed?'':'disabled'}>${icon('chevron')}</button><div class="dp-month-selects">${p.mode==='date'?`<select id="dp-month" aria-label="Month">${monthOptions}</select>`:''}<select id="dp-year" aria-label="Year">${yearOptions}</select></div><button type="button" class="icon-button" data-dp="next" aria-label="Next ${p.mode==='month'?'year':'month'}" ${nextAllowed?'':'disabled'}>${icon('chevron')}</button></div>${calendar}<div class="dp-presets">${presets.map(([v,label])=>`<button type="button" data-dp-preset="${v}">${label}</button>`).join('')}</div><div class="dp-selection" aria-live="polite">${icon('calendar')}<span>${esc(selection)}</span></div></div><div class="dp-footer"><button type="button" class="dp-clear" data-dp="clear" ${p.required?'disabled title="This date is required"':''}>Clear</button><button type="button" class="btn btn-secondary" data-dp="cancel">Cancel</button><button type="button" class="btn btn-primary dp-apply" data-dp="apply" ${(!p.value&&p.required||p.value&&!pickerValueAllowed(p.value))?'disabled':''}>${icon('check')}Use ${p.mode==='month'?'month':'date'}</button></div>`;
  const grid=$('.dp-grid')||$('.dp-month-grid');if(grid&&!grid.querySelector('[tabindex="0"]'))grid.querySelector('button:not(:disabled)')?.setAttribute('tabindex','0');
  if($('#date-picker').open)positionDatePicker();
}
function positionDatePicker(){
  const p=pickerSession,d=$('#date-picker');if(!p||!d.open)return;
  if(matchMedia('(max-width:540px)').matches){d.style.left='';d.style.top='';return;}
  const b=document.getElementById(p.id+'-trigger'),r=b?.getBoundingClientRect();if(!r)return;
  const height=d.getBoundingClientRect().height,width=d.getBoundingClientRect().width,vh=window.visualViewport?.height||window.innerHeight;
  const left=Math.max(12,Math.min(r.left,innerWidth-width-12));let top=r.bottom+8;
  if(top+height>vh-12)top=r.top-height-8;
  top=Math.max(12,Math.min(top,vh-height-12));d.style.left=left+'px';d.style.top=top+'px';
}
function closeDatePicker(focus=true){
  const p=pickerSession,dialog=$('#date-picker');if(dialog?.open)dialog.close();pickerSession=null;
  if(p){const b=document.getElementById(p.id+'-trigger');b?.setAttribute('aria-expanded','false');if(focus&&b?.isConnected)b.focus({preventScroll:true});}
  if(!$('#modal')?.open)document.body.classList.remove('modal-open');
}
function selectPickerValue(value){
  const p=pickerSession;if(!p||value&&!pickerValueAllowed(value))return;
  p.value=value;p.focus=value;
  if(value){const d=dateObj(p.mode==='month'?value+'-01':value);p.year=d.getFullYear();p.month=d.getMonth();}
  renderDatePicker();
  const selected=$('.dp-day.selected,.dp-month-choice.selected',$('#date-picker'));selected?.focus({preventScroll:true});
}
function applyPickerValue(){
  const p=pickerSession;if(!p||(!p.value&&p.required)||p.value&&!pickerValueAllowed(p.value))return;
  const input=p.input;if(!input.isConnected){closeDatePicker(false);return;}
  input.value=p.value;refreshDateTrigger(input);closeDatePicker();
  input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}));
}
function initInterfaceUpgrade(){
  const picker=document.createElement('dialog');picker.id='date-picker';picker.className='date-picker';picker.setAttribute('aria-labelledby','dp-title');picker.setAttribute('aria-modal','true');document.body.appendChild(picker);
  picker.addEventListener('cancel',e=>{e.preventDefault();closeDatePicker();});
  picker.addEventListener('click',e=>{
    e.stopPropagation();
    if(e.target===picker){const r=picker.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDatePicker();return;}
    const b=e.target.closest('button');if(!b||b.disabled)return;
    if(b.dataset.dpDate){selectPickerValue(b.dataset.dpDate);return;}
    if(b.dataset.dpMonth){selectPickerValue(b.dataset.dpMonth);return;}
    if(b.dataset.dpPreset){selectPickerValue(b.dataset.dpPreset);return;}
    const action=b.dataset.dp,p=pickerSession;if(!p)return;
    if(action==='cancel'){closeDatePicker();return;}
    if(action==='apply'){applyPickerValue();return;}
    if(action==='clear'){if(!p.required)selectPickerValue('');return;}
    if(action==='previous'||action==='next'){
      const delta=action==='previous'?-1:1;
      if(p.mode==='month')p.year+=delta;else {const d=new Date(p.year,p.month+delta,1);p.year=d.getFullYear();p.month=d.getMonth();}
      p.focus='';renderDatePicker();$('[data-dp="'+action+'"]',picker)?.focus({preventScroll:true});
    }
  });
  picker.addEventListener('change',e=>{
    e.stopPropagation();if(!pickerSession)return;
    const id=e.target.id,p=pickerSession;
    if(id==='dp-month')p.month=Number(e.target.value);if(id==='dp-year')p.year=Number(e.target.value);
    if(!pickerMonthAllowed(p.year,p.month)){
      const valid=Array.from({length:12},(_,m)=>m).filter(m=>pickerMonthAllowed(p.year,m));if(valid.length)p.month=valid[0];
    }
    p.focus='';renderDatePicker();$('#'+id,picker)?.focus({preventScroll:true});
  });
  picker.addEventListener('keydown',e=>{
    const target=e.target.closest('[data-dp-date]');if(!target||!pickerSession)return;
    const d=dateObj(target.dataset.dpDate),key=e.key;
    if(key==='ArrowLeft')d.setDate(d.getDate()-1);else if(key==='ArrowRight')d.setDate(d.getDate()+1);else if(key==='ArrowUp')d.setDate(d.getDate()-7);else if(key==='ArrowDown')d.setDate(d.getDate()+7);else if(key==='Home')d.setDate(d.getDate()-(d.getDay()+6)%7);else if(key==='End')d.setDate(d.getDate()+6-(d.getDay()+6)%7);else if(key==='PageUp'||key==='PageDown'){
      const wanted=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+(key==='PageUp'?-1:1)*(e.shiftKey?12:1));d.setDate(Math.min(wanted,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));
    }else return;
    e.preventDefault();let value=localDate(d);const p=pickerSession;if(p.min&&value<p.min)value=p.min;if(p.max&&value>p.max)value=p.max;if(!pickerValueAllowed(value))return;
    const next=dateObj(value);p.year=next.getFullYear();p.month=next.getMonth();p.focus=value;renderDatePicker();$('[data-dp-date="'+value+'"]',picker)?.focus({preventScroll:true});
  });

    const roots=new Set();for(const r of records){if(r.addedNodes.length){const host=r.target.closest?.('#main,#modal-content');if(host)roots.add(host);}}
    roots.forEach(enhanceUI);

  document.addEventListener('change',e=>{if(e.target.id==='restore-confirm'){const button=$('#restore-apply');if(button)button.disabled=!e.target.checked;}});
  document.addEventListener('dragover',e=>{const drop=e.target.closest?.('[data-backup-drop]');if(drop){e.preventDefault();e.dataTransfer.dropEffect='copy';drop.classList.add('drag-over');}});
  document.addEventListener('dragleave',e=>{const drop=e.target.closest?.('[data-backup-drop]');if(drop&&!drop.contains(e.relatedTarget))drop.classList.remove('drag-over');});
  document.addEventListener('drop',e=>{const drop=e.target.closest?.('[data-backup-drop]');if(!drop)return;e.preventDefault();drop.classList.remove('drag-over');if(e.dataTransfer.files.length!==1){toast('Choose one JSON backup at a time.',true);return;}importBackup(e.dataTransfer.files[0]);});
  $('#modal').addEventListener('close',()=>{if(!$('#modal').open){closeDatePicker(false);document.body.classList.remove('modal-open');}});
  window.addEventListener('resize',positionDatePicker);window.visualViewport?.addEventListener('resize',positionDatePicker);
}

document.addEventListener('input',event=>{
  const id=event.target.id;
  if(id==='loan-outstanding'&&modalDraft?.type==='loan')modalDraft.outstandingTouched=true;
  if(id==='loan-principal'&&modalDraft?.type==='loan'&&!modalDraft.outstandingTouched)$('#loan-outstanding').value=event.target.value;

document.addEventListener('change',event=>{
  const id=event.target.id;
  if(['loan-move','loan-account','loan-currency'].includes(id))updateLoanPreview();

document.addEventListener('click',event=>{const page=event.target.closest('[data-page]');if(page){event.preventDefault();setPage(page.dataset.page);return;}const action=event.target.closest('[data-action]');if(action){event.preventDefault();handleAction(action.dataset.action,action);return;}if(ui.openMenu&&!event.target.closest('.asset-menu')){ui.openMenu=null;const grid=$('#asset-grid');if(grid)grid.innerHTML=assetCards();}});
document.addEventListener('input',event=>{if(['entry-amount','entry-note','entry-date','entry-counterparty'].includes(event.target.id))updateEntryPreview();});

  else if(id==='activity-kind'){ui.activityKind=t.value;ui.activityPage=1;$('#activity-content').innerHTML=activityContents();}

document.addEventListener('submit',event=>{event.preventDefault();if(pendingExternal){formError('Another tab changed this workspace. Close this form, then reopen it with the latest data.');return;}const form=event.target;if(!form.reportValidity())return;
  if(form.id==='asset-form')saveAsset();
  else if(form.id==='entry-form')saveEntry();
  else if(form.id==='loan-form')saveLoan();
  else if(form.id==='repayment-form')saveLoanPayment();
  else if(form.id==='profile-form'){const name=$('#profile-name').value.trim();if(!name)return formError('Please enter your display name.');state.profile={name,subtitle:$('#profile-subtitle').value.trim()||'Personal portfolio',photo:modalDraft.photo,badge:$('#profile-badge').checked};closeModal();commit('Profile updated.',{snapshot:false});}
  else if(form.id==='currency-form'){const code=$('#currency-code').value.trim().toUpperCase(),r=Number($('#currency-rate').value);if(!/^[A-Z][A-Z0-9]{1,9}$/.test(code))return formError('Use a currency code such as EUR, AED or INR.');if(Object.hasOwn(state.settings.rates,code))return formError('This currency already exists. Update it in Settings instead.');if(!validNumber(r,1e-12,1e12))return formError('Enter a positive conversion rate.');state.settings.rates[code]=r;closeModal();commit('Currency added. You can now select it for an asset.');}
  else if(form.id==='rates-form'){const next={...state.settings.rates};for(const el of $$('[data-rate]',form)){const value=Number(el.value);if(!validNumber(value,1e-12,1e12)){toast('All exchange rates must be positive numbers.',true);return;}next[el.dataset.rate]=value;}state.settings.rates=next;commit('Conversion rates saved. Your USDT totals are updated.');}
});
$('#modal').addEventListener('click',event=>{if(event.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal();}});
$('#modal').addEventListener('close',()=>{modalDraft=null;if(pendingExternal){state=pendingExternal;pendingExternal=null;resetFilters();render();toast('Latest workspace loaded from the other tab.');}});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(['overview','cash','loans','tracker','activity','settings','backup'].includes(p)&&ui.page!==p){ui.page=p;render();}});
window.addEventListener('beforeunload',event=>{if(!storageOk){event.preventDefault();event.returnValue='Unsaved changes. Export a backup before leaving.';}});
window.addEventListener('storage',event=>{if(event.key!==STORAGE_KEY||!event.newValue)return;try{const updated=validateState(JSON.parse(event.newValue));if($('#modal').open){pendingExternal=updated;formError('This workspace changed in another tab. Close this form to load the latest version.');toast('Another tab updated this workspace. Close this form before continuing.',true);return;}state=updated;render();toast('Workspace updated from another tab.');}catch(err){toast('Another tab changed the saved data, but it could not be read.',true);}});
initInterfaceUpgrade();
render();
if(!storageOk)setTimeout(()=>toast(persistenceBlocked?'Saved data needs recovery. It has not been overwritten. Open Settings.':'Browser saving is unavailable. Use Export JSON to keep your work.',true),600);
})();
